<head>
  <title>Pedro Carmo - {{ page.title }}</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="Copyright" content="Copyright Pedro Carmo 2015. All Rights Reserved.">
  <link rel="shortcut icon" href="{{ base.url }}/assets/images/favicon.ico" type="image/x-icon"/>
  {% if page.url == "/" %}
  <!-- the particle portrait is the first thing on screen, so its source photo comes first -->
  <link rel="preload" as="image" href="/assets/images/avatar-particles.jpg" fetchpriority="high">
  <!-- Figtree for the cover's small labels, trimmed to just the letters in "Sound on" / "Sound off" / "Tap to enter" -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500&text=Sound%20onfTaper&display=swap">
  <!-- Mr De Haviland for the signature, trimmed to its letters -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mr+De+Haviland&text=%E2%80%94Pedro&display=swap">
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;700&display=swap">
  <link href="{{ base.url }}/css/main.css?v={{ site.time | date: "%s" }}" type="text/css" rel="stylesheet">
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="preconnect" href="https://p.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/vdp7mxz.css">
</head>
